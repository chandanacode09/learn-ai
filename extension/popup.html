<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Explainer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .container {
      background: white;
      border-radius: 0;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #555;
    }

    select, button {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    select {
      background: white;
      cursor: pointer;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
    }

    .result h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #667eea;
    }

    .result p {
      font-size: 13px;
      line-height: 1.6;
      color: #555;
    }

    .takeaway {
      padding: 8px;
      background: white;
      border-left: 3px solid #667eea;
      margin-bottom: 8px;
      font-size: 12px;
      border-radius: 3px;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 10px;
    }

    .current-url {
      font-size: 11px;
      color: #777;
      margin-bottom: 15px;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      background: #e0e7ff;
      color: #4c51bf;
      border-radius: 12px;
      font-size: 11px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧠 AI Content Explainer</h1>
      <p>Understand this page at any level</p>
    </div>

    <div class="content">
      <div id="current-url" class="current-url">Loading...</div>

      <div class="form-group">
        <label for="level">Explanation Level</label>
        <select id="level">
          <option value="eli5">ELI5 (Explain Like I'm 5)</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate" selected>Intermediate</option>
          <option value="advanced">Advanced</option>
          <option value="expert">Expert</option>
        </select>
      </div>

      <div class="form-group">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="personal" selected>Personal (Quick & Friendly)</option>
          <option value="educational">Educational (Detailed)</option>
          <option value="professional">Professional (Actionable)</option>
        </select>
      </div>

      <button id="explain-btn">Explain This Page</button>

      <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <p style="margin-top: 10px; font-size: 13px; color: #666;">Generating explanation...</p>
      </div>

      <div id="error" class="error" style="display: none;"></div>

      <div id="result" class="result" style="display: none;">
        <span id="result-badge" class="badge"></span>
        <h3>💡 Summary</h3>
        <p id="summary"></p>

        <h3 style="margin-top: 15px;">🎯 Key Takeaways</h3>
        <div id="takeaways"></div>

        <button id="view-full" style="margin-top: 15px; background: #48bb78;">
          View Full Explanation
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
